name: Check deployed package

# CI runs it after each release; run it by hand on any branch to check any version.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to check, such as 0.1.0; empty checks the latest
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LOGDASH_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      # NuGet serves a version some minutes after its push.
      - name: Wait until NuGet serves the version
        if: inputs.version != ''
        timeout-minutes: 30
        run: until curl -fsS https://api.nuget.org/v3-flatcontainer/logdash/index.json | grep -qF "\"$LOGDASH_VERSION\""; do sleep 30; done
      - run: ./check-deployed-package/run.sh
        env:
          LOGDASH_API_KEY: ${{ secrets.LOGDASH_API_KEY }}
          LOGDASH_PERSONAL_API_KEY: ${{ secrets.LOGDASH_PERSONAL_API_KEY }}
